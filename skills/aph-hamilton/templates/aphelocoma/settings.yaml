# Hamilton state privacy is explicit. `tracked` keeps compact plans, specs, and the redacted ledger in
# version control; `local` keeps all of .aphelocoma/ out of version control. Dispatch prompts, worker
# results, temporary files, backups, and logs are transient in BOTH modes and are never durable state.
visibility: tracked
redact_sensitive: true

# Optional model settings for this project's Hamilton crew. These override the global default crew for
# THIS project. After editing model settings on Claude Code, run `/aph-hamilton sync-agents` and restart
# the session so it reloads agent files.
#
# Any role NOT listed below uses your current session's model — i.e. your best model (opus today,
# fable later) automatically, with nothing to change when the best model changes. List a role only to
# pin it to a specific model. The model dial is separate from a role's tool scope (e.g. the qa-engineer
# reviewer can run on a strong model yet stay look-only per its role file).
models:
  technical-writer: sonnet   # one step down — medium is plenty for mechanical docs

# Want to force ONE model on the whole crew instead of following your session? Add a default (note this
# also applies to anyone you share Hamilton with, so prefer it for personal use):
#   default: opus            # or sonnet / haiku / fable

# Reasoning effort (a separate dial from model): low | medium | high | xhigh | max. Any role NOT listed
# inherits your session's effort (set via `/effort`), so `/effort high` already flows to the whole crew.
# Uncomment to pin specific roles — e.g. let the reviewer/architect think harder, or docs think less:
# effort:
#   qa-engineer: xhigh
#   software-architect: xhigh
#   technical-writer: medium

# On Codex, `models:` values are Codex model names (they feed `codex exec -m`) and effort maps to
# `-c model_reasoning_effort=...` — see the definition's DISPATCH-CODEX.md. No sync-agents/restart
# needed there; these are read at dispatch time.

# Parallel dispatch overrides (optional — PARALLEL.md defaults are right for most projects).
# On Codex, `auto` = codex-exec fan-out (the stable default); `collab` opts in to the experimental
# spawn_agent tools (also used automatically if exec preflight fails — DISPATCH-CODEX.md):
# dispatch: auto        # auto (default) | exec | collab | sequential
# max_parallel: 4       # Codex codex-exec backend: max concurrent workers per batch
