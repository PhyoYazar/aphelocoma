name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.x"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Bash installer syntax
        run: bash -n install.sh

      - name: Run standard-library test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Validate live Hamilton project state
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python skills/aph-hamilton/references/validate.py .

      - name: Recheck package and release inventories
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest -v tests.test_package_inventory tests.test_release_smoke

      - name: Smoke test isolated installation
        shell: bash
        run: |
          set -euo pipefail
          APH_TEST_HOME="$RUNNER_TEMP/aphelocoma-home"
          APH_TEST_ROOT="$RUNNER_TEMP/aphelocoma-root"
          mkdir -p "$APH_TEST_HOME"
          env \
            HOME="$APH_TEST_HOME" \
            APHELOCOMA_ROOT="$APH_TEST_ROOT" \
            APHELOCOMA_INSTALL_SOURCE="$GITHUB_WORKSPACE" \
            bash install.sh
          env \
            HOME="$APH_TEST_HOME" \
            APHELOCOMA_ROOT="$APH_TEST_ROOT" \
            "$APH_TEST_ROOT/tool/bin/aph" version \
            > "$RUNNER_TEMP/aph-version.txt"
          test "$(cat "$RUNNER_TEMP/aph-version.txt")" = "aph $(cat VERSION)"
